<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    /* Container holding the background image */
    .studio-container {
      position: relative;
      width: 1000px; /* Match image width */
      height: 562px; /* Match image height */
      font-family: 'Courier New', monospace; /* Use a retro pixel font here */
      font-weight: bold;
      color: #2a1f3d;
    }

    .studio-bg {
      width: 100%;
      height: 100%;
    }

    /* Menu Container Text Overlay */
    .menu-overlay {
      position: absolute;
      top: 22%;
      right: 5%;
      width: 22%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Bottom Speech Bubble Overlay */
    .dialogue-overlay {
      position: absolute;
      bottom: 5%;
      left: 5%;
      width: 85%;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="studio-container">
    <img src="sticker_studio.png" alt="Sticker Studio" class="studio-bg">
    
    <!-- Menu overlay -->
    <div class="menu-overlay">
      <div>> Custom Vinyl</div>
      <div>> Holo Sheets</div>
      <div>> Pastel Drips</div>
      <div>> Clear Die-Cuts</div>
    </div>

    <!-- Dialogue overlay -->
    <div class="dialogue-overlay">
     Hey there~♪
    </div>
  </div>

</body>
</html>
